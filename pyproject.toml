[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nrforge"
version = "0.1.0"
description = "Numerical Relativity Forge: initial data generation and analysis utilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "Oliver Steppohn", email = "oliver.steppohn@uni-jena.de" },
]
dependencies = [
  "numpy >= 1.23.1",
  "scipy >= 1.10.0",
  "matplotlib >= 3.5.3",
  "jinja2 >= 3.1.5"
]

[project.urls]
Homepage = "https://github.com/spacetimecurv/NRForge"
Source = "https://github.com/spacetimecurv/NRForge"

[tool.setuptools.packages.find]
where = ["."]
include = ["nrforge*"]
exclude = ["nrforge.tests*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.json", "*.par", "*.sh", "*.txt"]
